x-common-environment: &common-environment
  KAFKA_BROKERS: kafka:29092

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    topic-setup:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  topic-setup:
    build: .
    command: node scripts/create-topics.js
    environment: *common-environment
    depends_on:
      kafka:
        condition: service_healthy

  order-api:
    <<: *app
    command: node services/order-api/server.js
    environment: *common-environment
    ports:
      - "3000:3000"

  notification-service:
    <<: *app
    command: node services/notification-service/consumer.js
    environment: *common-environment

  inventory-service:
    <<: *app
    command: node services/inventory-service/consumer.js
    environment:
      <<: *common-environment
      INVENTORY_DELAY_MS: 0

  analytics-service:
    <<: *app
    command: node services/analytics-service/consumer.js
    environment:
      <<: *common-environment
      ANALYTICS_FAIL: "false"
      MAX_ATTEMPTS: 3

  dead-letter-monitor:
    <<: *app
    command: node services/dead-letter-monitor/consumer.js
    environment: *common-environment
